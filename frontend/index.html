<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamLens — Study smarter from your own notes and past papers</title>
    <meta name="description" content="Turn lecture-board photos and past question papers into notes, flashcards, topic insights, and a personalized study plan." />
    <meta name="theme-color" content="#FF8233" />

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="shortcut icon" href="/brand/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/site.webmanifest" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="ExamLens — Study smarter from your own notes and past papers" />
    <meta property="og:description" content="Turn lecture-board photos and past question papers into connected notes, flashcards, and a student-first study plan." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ExamLens — Study smarter from your own notes and past papers" />
    <meta name="twitter:description" content="Turn lecture-board photos and past question papers into notes, flashcards, and an exam plan." />
    <meta name="twitter:image" content="/brand/og-image.png" />

    <!-- Google Fonts: Figtree (warm, friendly body & headings) & JetBrains Mono (code/equations/OCR only) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" integrity="sha384-wcIxkf4k558AjM3Yz3BBFQUbk/zgIYC2R0QpeeEl+kDmsCEqvQxrqP9hBLSkUtAI" crossorigin="anonymous">

    <!-- Theme detection: runs synchronously BEFORE first paint to prevent flash (default: light) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('examlens-theme');
          var theme = stored || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-ink antialiased selection:bg-primary-tint selection:text-primary-text min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
